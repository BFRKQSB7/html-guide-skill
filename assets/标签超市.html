<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签超市 · 交互式提示词标签生成器（骨架模板 · 示例数据）</title>
<!--
  ════════════════════════════════════════════════════════════
  ⚠️ 本文件是【骨架模板】：只含少量示例标签（FULL_TAGS 已剔除），供复制做起点。
  注入全量库：用生成脚本（如 work/p5_export.py + p5_splice.py）把新的
  FULL_TAGS 数组按锚点 const FULL_TAGS = [ 替换进来（勿整行 Read）。
  ════════════════════════════════════════════════════════════

  ⚠️⚠️ 最高优先级警告 ⚠️⚠️
  全量标签库 const FULL_TAGS = [ ... ] 是仅示例标签 37 条（全量库由生成脚本注入）
  （位置在文件前 1/6 处附近，行号随编辑漂移，请按声明名定位）。
  ● 绝对不要用 Read 读取包含 const FULL_TAGS = [ 这一行的范围（会超限 / 卡死 / 爆上下文）。
  ● 查 / 改某个标签：用 Grep 搜 `["标签英文名",`（例：["newest", ["absurdres",）。
  ● 想插新标签进全量库：用脚本按锚点 `const FULL_TAGS = [` 做字符串替换，别整行读。

  文件结构（按先后顺序，声明名即 Grep 定位锚点）：
  <style> 区               全部样式
  <body> 布局 + 顶栏
  <div class="search">     全局搜索框（search 输入 + results）
  const FULL_TAGS = [...]  ← 全量标签库由生成脚本注入（本模板仅示例），勿整读！）
  const CURATED = {...}    常用分类（人工精选：质量词 / 年代/日期 / 发色 / 服装 …）
  const AUTO = {...}       自动归类规则（en 关键词→分类）+ AUTO_RE + AUTO_EXCLUDE
  const NEG_WORDS          负面词集合
  const CURATED_ZH = {...} 人工中文翻译补丁（优先于数据库内中文）
  const SUBS = {...}       二级标签细分
  /* 构建分类 */            fullMap / catMap / buildCats() / 收藏 / 回填识别
  之后                     渲染 + 事件绑定（分类面板、搜索、权重、收藏…）

  数据库维护（增删改标签）：
  条目格式：["英文名","中文名",分类号,热度count]  例：["long_hair","长发",0,6089154]
  分类号：0=通用  1=画师  3=版权/作品  4=角色  5=画质/meta（5 不自动归类，只靠 CURATED 精选显示）
  ● 加到「常用分类」（推荐，无需碰巨行）：
      1) 在 const CURATED 对应分类数组加英文名（如 "newest"）
      2) 库里没这词 → 在 const CURATED_ZH 补中文（否则界面显示英文原文）
      3) 刷新页面即生效（全在浏览器端，无构建步骤）
  ● 加到「全局搜索也可搜」：额外用脚本把整条 ["英文名","中文",分类号,0]
      插入 const FULL_TAGS 数组（锚点 const FULL_TAGS = [，字符串替换，勿整读该行）。
  ● 删标签：从 CURATED 删最安全；从 FULL_TAGS 删要编辑巨行（先备份再动）。
  ● 改中文名：改 CURATED_ZH（优先级最高）或 FULL_TAGS 里对应条目。
  ● 分类号 5 的词（highres / newest / safe 等）不会进「全部」自动分类，必须同时在 CURATED 里出现。
  ● count 影响排序：新词填 0 可搜到，但不会排进「全部」前 1000。
-->
<style>
  :root{
    --bg:#0e131f; --card:#151d2e; --card2:#0a0f1a; --border:#26324a;
    --text:#e2e8f0; --text2:#8b9bb4; --accent:#4f8ef7; --accent-soft:rgba(79,142,247,.14);
    --pos:#2dd4bf; --pos-soft:rgba(45,212,191,.14); --neg:#f87171; --neg-soft:rgba(248,113,113,.14);
    --fav:#f5b942; --fav-soft:rgba(245,185,66,.14);
    --radius:8px;
  }
  html[data-theme="light"]{
    --bg:#f5f4f1; --card:#ffffff; --card2:#efede8; --border:#e2dfd8;
    --text:#1e293b; --text2:#5b6b7f; --accent:#4f8ef7; --accent-soft:rgba(79,142,247,.12);
    --pos:#0e9f7e; --pos-soft:rgba(45,212,191,.15); --neg:#e0574f; --neg-soft:rgba(248,113,113,.13);
    --fav:#d99a1f; --fav-soft:rgba(245,185,66,.16);
    --radius:8px;
  }
  html[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c9c6bf}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a3558;border-radius:5px}::-webkit-scrollbar-track{background:transparent}

  /* ===== 顶栏（吸顶：搜索 + 输出）===== */
  .topbar{flex:none;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px 12px;max-height:72vh;overflow-y:auto}
  .head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .head h1{font-size:17px}
  .head .meta{font-size:12px;color:var(--text2)}
  .search{position:relative;margin-bottom:10px}
  .search input{width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search .results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);max-height:280px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;z-index:60}
  .search .results.show{display:block}
  .search .results .r-tag{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  .search .results .r-tag:hover{background:var(--accent-soft)}
  .search .results .r-tag .en{color:var(--accent);font-size:12px}
  .search .results .r-tag .zh{color:var(--text)}
  .search .results .r-tag .st{color:var(--fav);font-size:13px;opacity:.35;cursor:pointer;transition:opacity .12s}
  .search .results .r-tag:hover .st{opacity:.85}
  .search .results .r-tag.faved{background:var(--fav-soft)}
  .search .results .r-tag.faved .st{opacity:1}
  .search .results .r-tag.sel{background:var(--pos-soft)}

  /* 输出 */
  .output{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .obox{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px}
  .obox label{font-size:12px;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
  .obox label .cnt{font-size:11px;color:var(--text2)}
  .obox textarea{width:100%;height:96px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:Consolas,monospace;font-size:12.5px;padding:8px;resize:vertical;outline:none}
  .obox textarea:focus{border-color:var(--accent)}
  .obox textarea.pos{border-left:3px solid var(--pos)}
  .obox textarea.neg{border-left:3px solid var(--neg)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;min-height:26px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:2px 8px;font-size:12px;cursor:pointer}
  .chip .zh{color:var(--text)}
  .chip .en{color:var(--text2);font-size:11px}
  .chip .x{color:var(--text2);font-weight:700;opacity:.7;cursor:pointer}
  .chip{cursor:grab}
  .chip:active{cursor:grabbing}
  .chip.dragging{opacity:.5;border-style:dashed}
  .chip .x:hover{opacity:1;color:var(--neg)}
  .chip.pos{border-color:var(--pos)}
  .chip.neg{border-color:var(--neg)}
  .chip.raw{border-style:dashed;border-color:var(--fav)}
  .chip.raw .en{color:var(--text)}
  .chip.raw .raw-badge{color:var(--fav);font-size:10px;font-weight:700;line-height:1}
  .chip .w{color:var(--accent);font-size:10px;font-weight:700;background:var(--accent-soft);border-radius:8px;padding:0 4px;line-height:1.4}
  .w-edit{position:fixed;z-index:100;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .w-edit .w-input{width:52px;background:var(--card2);border:1px solid var(--border);border-radius:5px;color:var(--text);font:12px Consolas,monospace;text-align:center;padding:2px;outline:none}
  .w-edit .w-step{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:5px;font-size:12px;width:22px;height:22px;line-height:1;cursor:pointer;font-weight:700}
  .w-edit .w-step:hover{background:var(--accent-soft);color:var(--accent)}
  .w-edit .w-reset{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:5px;font-size:11px;padding:0 6px;height:22px;line-height:1;cursor:pointer}
  .w-edit .w-reset:hover{background:var(--accent-soft);color:var(--accent)}
  .btnrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .auto-path{color:var(--text2);font-size:11px;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;cursor:default}
  .btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
  .btn.danger{background:var(--neg-soft);color:var(--neg);border:1px solid var(--neg)}
  .btn.fav{background:var(--fav-soft);color:var(--fav);border:1px solid var(--fav)}

  /* ===== 分类区 ===== */
  /* 胶囊分类条：收藏固定最左（不受滚动控制），其余横向滚动 */
  .pills-row{flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px 6px}
  .fav-fixed{flex:none}
  .pills-scroll{flex:1;min-width:0;display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;align-items:center}
  /* 二级标签行 */
  .subs-row{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 16px 8px}
  .subs-row:empty{display:none}
  .sub-pill{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:3px 11px;font-size:12px;white-space:nowrap;cursor:pointer;color:var(--text2);transition:all .12s}
  .sub-pill:hover{border-color:var(--accent);color:var(--text)}
  .sub-pill.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:5px 13px;font-size:13px;white-space:nowrap;cursor:pointer;transition:all .12s;color:var(--text)}
  .pill .n{font-size:10.5px;color:var(--text2);background:var(--border);padding:0 6px;border-radius:8px}
  .pill:hover{border-color:var(--accent)}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill.active .n{background:rgba(255,255,255,.25);color:#fff}
  .pill.fav-pill{background:var(--fav-soft);border-color:var(--fav)}
  .pill.fav-pill.active{background:var(--fav);border-color:var(--fav);color:#1a1200}
  /* 常驻标签面板：占满剩余整页高度，内部滚动 */
  .tagpanel{flex:1;min-height:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow-y:auto;margin:4px 16px 16px}
  .tagpanel .tags{display:flex;flex-wrap:wrap;gap:5px;padding:12px}
  .tagpanel .empty{padding:20px;color:var(--text2);font-size:13px;text-align:center}
  .tagpanel .tag{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
  .tagpanel .tag .zh{color:var(--text)}
  .tagpanel .tag .en{color:var(--text2);font-size:11px}
  .tagpanel .tag .st{font-size:12px;color:var(--fav);opacity:.35;transition:opacity .12s}
  .tagpanel .tag:hover{border-color:var(--accent)}
  .tagpanel .tag:hover .st{opacity:.85}
  .tagpanel .tag.faved{border-color:var(--fav)}
  .tagpanel .tag.faved .st{opacity:1}
  .tagpanel .tag.sel{background:var(--pos-soft);border-color:var(--pos)}
  .tagpanel .tag.sel .zh{color:var(--pos)}
  .tagpanel .tag.neg-sel{background:var(--neg-soft);border-color:var(--neg)}
  .tagpanel .tag.neg-sel .zh{color:var(--neg)}
  .tagpanel .tag.hidden{display:none}
  .tagpanel .load-more{display:block;margin:14px auto;padding:7px 24px;background:var(--card2);border:1px solid var(--border);border-radius:20px;color:var(--accent);font-size:13px;cursor:pointer;transition:all .12s}
  .tagpanel .load-more:hover{border-color:var(--accent);background:var(--accent-soft)}
  .tagpanel .load-more-bar{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 12px;color:var(--text2);font-size:12.5px}
  .cat{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .cat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);cursor:pointer;user-select:none}
  .cat-head:hover{background:#1a2438}
  .cat-head .arrow{transition:transform .15s;font-size:11px;color:var(--text2);width:12px}
  .cat-head.closed .arrow{transform:rotate(-90deg)}
  .cat-head .nm{font-size:14px;font-weight:600}
  .cat-head .n{font-size:11px;color:var(--text2);background:var(--border);padding:1px 8px;border-radius:10px}
  .cat-head .star{color:var(--fav);font-size:15px}
  .cat-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
  .cat.open .cat-body{max-height:300px;overflow-y:auto}
  .tags{display:flex;flex-wrap:wrap;gap:5px;padding:10px}
  .tag{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:3px 9px;font-size:12.5px;cursor:pointer;transition:all .12s}
  .tag .zh{color:var(--text)}
  .tag .en{color:var(--text2);font-size:11px}
  .tag .st{color:var(--fav);opacity:.35;font-size:12px}
  .tag:hover{border-color:var(--accent)}
  .tag:hover .st{opacity:.8}
  .tag.sel{background:var(--pos-soft);border-color:var(--pos)}
  .tag.sel .zh{color:var(--pos)}
  .tag.neg-sel{background:var(--neg-soft);border-color:var(--neg)}
  .tag.neg-sel .zh{color:var(--neg)}
  .tag.faved{background:var(--fav-soft)}
  .tag.faved .st{opacity:1}
  .tag.hidden{display:none}
  .empty{color:var(--text2);font-size:12px;padding:6px 10px}
</style>
</head>
<body>

<div class="topbar">
  <div class="head">
    <h1>标签超市 · 骨架模板</h1>
    <span class="meta" id="meta"></span>
  </div>

  <!-- ① 全局标签搜索 -->
  <div class="search">
    <input id="search" type="text" placeholder="🔍 全局搜索全量标签（中文或英文，如：大胸 / masturbation / 高马尾）" autocomplete="off">
    <div class="results" id="searchRes"></div>
  </div>

  <!-- ② 正反面提示词复制栏 -->
  <div class="output">
    <div class="obox">
      <label>正面提示词 <span class="cnt" id="posCnt">0</span></label>
      <textarea id="posOut" class="pos" placeholder="点击标签自动生成；也可直接粘贴已有提示词，自动识别成胶囊（匹配数据库显示中文，未匹配保留原文）…"></textarea>
      <div class="chips" id="posChips"></div>
    </div>
    <div class="obox">
      <label>负面提示词 <span class="cnt" id="negCnt">0</span></label>
      <textarea id="negOut" class="neg" placeholder="负面词分类的标签或手动翻转到负面的标签会进这里；同样支持粘贴识别…"></textarea>
      <div class="chips" id="negChips"></div>
    </div>
  </div>
  <div class="btnrow">
    <button class="btn primary" onclick="copyPos()">复制正面</button>
    <button class="btn primary" onclick="copyNeg()">复制负面</button>
    <button class="btn primary" onclick="copyAll()">复制全部</button>
    <button class="btn fav" id="favOnlyBtn" onclick="toggleFavOnly()">仅看收藏: 关</button>
    <button class="btn danger" onclick="clearAll()">清空</button>
    <button class="btn ghost" onclick="importFav()">导入收藏</button>
    <button class="btn ghost" onclick="exportFav()">导出收藏</button>
    <button class="btn fav" id="autoBtn" onclick="toggleAutoSave()" oncontextmenu="event.preventDefault();reselectFav();" title="每次收藏变动自动保存为文件夹内 dtag_fav.json；右键可重选保存文件夹">自动保存: 关</button><span id="autoPath" class="auto-path"></span>
    <button class="btn ghost" onclick="savePreset()" title="把当前正面+负面存为唯一预设（与收藏同存 dtag_fav.json）">存预设</button>
    <button class="btn ghost" onclick="loadPreset()" title="载入保存的预设（正面+负面）">载预设</button>
    <button class="btn danger" onclick="clearPreset()" title="清除已保存的预设">清预设</button>
  </div>
</div>
<button class="btn ghost" onclick="toggleTheme()" title="切换深浅色（默认深色）" style="position:fixed;top:8px;right:10px;z-index:120;padding:4px 10px">🌓 深浅色</button>

<!-- ③ 分类胶囊：收藏固定最左 + 其余可滚动 -->
<div class="pills-row">
  <div class="fav-fixed" id="favPill"></div>
  <div class="pills-scroll" id="pills"></div>
</div>
<div class="subs-row" id="subsRow"></div>
<!-- ④ 常驻标签面板 -->
<div class="tagpanel" id="tagpanel"></div>

<script>
/* ============ 全量标签库（示例 37 条，en→zh）============ */
const FULL_TAGS = [
  ["1girl","1个女孩",0,8254296],
  ["highres","高分辨率",5,7960715],
  ["solo","单人",0,6934337],

  ["smile","微笑",0,4089712],
  ["blue_eyes","蓝眼睛",0,2426235],
  ["white_background","白色背景",0,2288019],

  ["skirt","裙子",0,2140648],
  ["blonde_hair","金发",0,2132186],
  ["1boy","1个男孩",0,2085930],
  ["dress","连衣裙",0,1911916],
  ["standing","站着",0,1307722],
  ["sitting","坐着",0,1290167],
  ["pink_hair","粉发",0,1037480],
  ["swimsuit","泳装",0,898348],
  ["flower","花",0,868675],
  ["glasses","眼镜",0,495058],
  ["cloud","云",0,391299],
  ["rabbit_ears","兔耳",0,319148],
  ["genshin_impact","原神",3,308710],
  ["armor","铠甲",0,301429],
  ["water","水",0,287079],
  ["gun","枪",0,193124],
  ["night","夜晚",0,167668],
  ["kneeling","跪姿",0,154757],
  ["hatsune_miku","初音未来",4,143160],
  ["katana","武士刀",0,82392],
  ["sunset","日落",0,38679],
  ["witch","女巫",0,24418],
  ["miko","巫女",0,22763],
  ["newest","最新",5,0],
  ["safe","安全(全年龄)",5,0],
  ["easynegative","EasyNegative(通用负面)",0,0],
  ["low_quality","低质量",0,0],
  ["worst_quality","最差质量",0,0],
  ["bad-hands","坏手",0,0]
];

/* ============ 常用分类（人工精选 + 全量库自动归类）============ */
const CURATED = {
"质量词":["masterpiece","best quality","newest","safe","amazing quality","absurdres","highres","very detailed","detailed face","detailed background"],
"年代/日期":["old","early","mid","recent","newest"],
"角色数量":["1girl","1boy","2girls","solo","multiple people","2boys","3girls","1other","crowd"],

function showWeightEditor(chip,s){
  if(weightEditor){ weightEditor.remove(); weightEditor=null; }
  const ed=document.createElement('div');
  ed.className='w-edit';
  const input=document.createElement('input');
  input.type='text'; input.className='w-input'; input.value=String(s.w||1); input.title='只认阿拉伯数字，Enter 确认';
  const dec=document.createElement('button'); dec.className='w-step'; dec.textContent='−';
  const inc=document.createElement('button'); inc.className='w-step'; inc.textContent='+';
  const rst=document.createElement('button'); rst.className='w-reset'; rst.textContent='重置';
  input.oninput=()=>{ input.value=input.value.replace(/[^\d.]/g,''); };
  const step=d=>{ const v=parseFloat(input.value)||1; input.value=String(Math.round((v+d)*100)/100); };
  dec.onclick=()=>step(-0.1);
  inc.onclick=()=>step(0.1);
  rst.onclick=()=>{ input.value='1'; apply(); };
  const apply=()=>{
    const v=input.value.trim();
    if(!/^\d+(\.\d+)?$/.test(v)){ flash('✗ 权重只认阿拉伯数字'); return; }
    const n=parseFloat(v);
    s.w=(n===1)?null:Math.round(n*100)/100;   // 权重 1 视为无权重，不显示
    refresh();
    if(weightEditor){ weightEditor.remove(); weightEditor=null; }
  };
  input.onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault(); apply(); }
    else if(e.key==='Escape'){ ed.remove(); weightEditor=null; }
  };
  ed.append(dec,input,inc,rst);
  const r=chip.getBoundingClientRect();
  ed.style.left=Math.max(4,Math.min(r.left,innerWidth-210))+'px';

function reorderChips(targetKey,isNeg){
  if(!dragKey||dragKey===targetKey) return;
  const keys=[...selected.keys()];
  const posKeys=keys.filter(k=>!selected.get(k).neg);
  const negKeys=keys.filter(k=>selected.get(k).neg);
  const src=isNeg?negKeys:posKeys;
  const from=src.indexOf(dragKey), to=src.indexOf(targetKey);
  if(from<0||to<0) return;
  src.splice(from,1); src.splice(to,0,dragKey);
  const newMap=new Map();
  posKeys.forEach(k=>newMap.set(k,selected.get(k)));
  negKeys.forEach(k=>newMap.set(k,selected.get(k)));
  selected=newMap;
  refresh();
}

/* ============ 提示词回填识别：粘贴/输入 → 自动识别成胶囊 ============ */
const escHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parsePromptTokens(text){
  const seen=new Set(), out=[];
  let cur='', depth=0;
  const flush=()=>{
    const t=cur.trim().replace(/\s+/g,' ');
    if(t && !seen.has(t.toLowerCase())){ seen.add(t.toLowerCase()); out.push(t); }
    cur='';
  };
  for(const ch of text){
    if(ch==='('){ depth++; cur+=ch; }
    else if(ch===')'){ depth=Math.max(0,depth-1); cur+=ch; }
    else if((ch===','||ch==='\n'||ch==='；'||ch===';'||ch==='，')&&depth===0){ flush(); }
    else cur+=ch;
  }
  flush();
  return out;
}
function parseWeight(tok){
  const m=tok.match(/^\((.+?):(\d+(?:\.\d+)?)\)$/);
  return m?{base:m[1].trim(),w:parseFloat(m[2])}:null;
}
function syncFromText(text, isNegBox){
  const newMap=new Map();
  [...selected.entries()].forEach(([k,v])=>{ if(v.neg!==isNegBox) newMap.set(k,v); });
  parsePromptTokens(text).forEach(tok=>{
    const pw=parseWeight(tok);
    const parts=pw?pw.base.split(/[,\n，;；]/).map(s=>s.trim()).filter(Boolean):[tok];
    parts.forEach(pt=>{
      const m=matchMap.get(pt.toLowerCase().replace(/_+/g,' '));
      if(m){
        const w=pw&&pw.w!==1?pw.w:null;   // 权重 1 视为无权重
        newMap.set(m.en.toLowerCase(),{en:m.en,zh:m.zh,neg:isNegBox,w});
      } else {
        const rawText=pw?`(${pt}:${pw.w})`:pt;   // 未匹配保留原文（含权重格式）
        newMap.set(rawText.toLowerCase(),{en:rawText,zh:null,neg:isNegBox});
      }
    });
  });
  selected=newMap;
  refresh();
}
let syncTimer=null;
[posOut,negOut].forEach((el,i)=>{
  el.addEventListener('paste',()=>setTimeout(()=>syncFromText(el.value,i===1),0));
  el.addEventListener('blur',()=>syncFromText(el.value,i===1));

        if(!favArr) throw new Error('bad format');
        const before=favSet.size;

      }catch(e){ flash('✗ JSON 格式不对，需字符串数组或 {fav:[...]}'); }

  if(!autoSaveOn){
    if(!dirHandle&&!favHandle){
      try{ dirHandle=await showDirectoryPicker({mode:'readwrite'}); }
      catch(e){ return; }
      favHandle=null; saveHandles();
    }
    const h=dirHandle||favHandle;
    if(h){
      try{
        const p=await h.requestPermission({mode:'readwrite'});
        if(p!=='granted'){ flash('✗ 未授权保存'); return; }
      }catch(e){}
    }
    autoSaveOn=true; localStorage.setItem('dtag_autosave','1');
    renderAutoBtn();
    await autoSaveWrite();
    flash('✓ 自动保存已开启（右键按钮可重选保存文件夹）');
  } else {
    autoSaveOn=false; localStorage.setItem('dtag_autosave','0');
    renderAutoBtn();
    flash('已关闭自动保存');
  }
}
function saveHandles(){ const o={}; if(dirHandle) o.dir=dirHandle; if(favHandle) o.file=favHandle; return favDbSet(o).catch(()=>{}); }
async function reselectFav(){
  if(!window.showDirectoryPicker){ flash('✗ 需 Chrome/Edge 浏览器'); return; }
  try{
    const opts={mode:'readwrite'};
    if(dirHandle) opts.startIn=dirHandle;   // 从上次保存的文件夹开始
    dirHandle=await showDirectoryPicker(opts);
    favHandle=null; saveHandles();
    renderAutoPath();
    if(autoSaveOn){ await autoSaveWrite(); flash('✓ 已更换保存文件夹'); }
    else flash('✓ 已记住保存文件夹，开启自动保存后生效');
  }catch(e){}
}
async function writeFavFile(){
  if(!dirHandle&&!favHandle) return;
  const json=favFileJson();
  const h=dirHandle||favHandle;
  const getTarget=dirHandle
    ?()=>dirHandle.getFileHandle('dtag_fav.json',{create:true})
    :()=>Promise.resolve(favHandle);
  try{
    const fh=await getTarget();
    const w=await fh.createWritable();
    await w.write(json); await w.close();
  }catch(e){
    try{
      const p=await h.requestPermission({mode:'readwrite'});
      if(p==='granted'){
        const fh=await getTarget();
        const w=await fh.createWritable();
        await w.write(json); await w.close();
        return;
      }
    }catch(e2){}
    flash('✗ 自动保存失败：文件或文件夹可能已被移动/删除');
  }
}
async function autoSaveWrite(){
  if(!autoSaveOn) return;
  await writeFavFile();
}

/* ============ 启动 ============ */
buildCats(); renderPills(); renderSubs(); renderPanel(); refresh();
document.getElementById('meta').textContent=`全量 ${FULL_TAGS.length} 标签`;
favDbGet().then(h=>{
  if(!h) return;
  if(h.dir && h.dir.kind==='directory'){ dirHandle=h.dir; favHandle=h.file||null; }
  else if(typeof h.createWritable==='function') favHandle=h;  // 旧格式：直接文件句柄
  renderAutoPath();
}).catch(()=>{});
renderAutoBtn();
</script>
